name: Сбор данных (ЦБ, T-Invest)

on:
  schedule:
    - cron: "13 3 * * *"   # ежедневно в 06:13 по Москве
  workflow_dispatch:        # ручной запуск: Actions → «Сбор данных (ЦБ, T-Invest)» → Run workflow

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install pandas numpy requests

      - name: Проверка доступа к источникам
        continue-on-error: true
        run: |
          for u in https://www.cbr.ru/scripts/XML_daily.asp https://iss.moex.com/iss/index.json https://invest-public-api.tbank.ru; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$u" || echo "ERR")
            echo "$u -> $code"
          done

      - name: Сертификаты Минцифры для T-Invest API
        # invest-public-api.tbank.ru подписан Russian Trusted Root CA (Минцифры), которого нет в certifi.
        # Набор certifi + сертификаты Минцифры подключается только клиенту T-Invest (TINVEST_CA_BUNDLE);
        # ISS и ЦБ работают со стандартным набором. Проверка TLS не отключается.
        # Источник — официальный адрес из инструкции Госуслуг (gosuslugi.ru/crt).
        continue-on-error: true
        env:
          # SHA-256 отпечатки, закреплённые при первой загрузке 07.10.2026 (сверить: gosuslugi.ru/crt).
          # При плановой смене сертификатов Минцифры шаг упадёт — обновить отпечатки (пусто — без сверки)
          RU_ROOT_SHA256: "D26D2D0231B7C39F92CC738512BA54103519E4405D68B5BD703E9788CA8ECF31"
          RU_SUB_SHA256: "BBBDE2103E790B999EC62BD03CF625A5A2E7C316E10AFE6A490EEDEAD8B3FD9B"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ru-ca"; mkdir -p "$d"
          get() {   # $1 — имя, $2 — URL; файл может быть PEM или DER
            curl -fsS -m 30 --retry 2 -o "$d/$1.raw" "$2"
            openssl x509 -in "$d/$1.raw" -out "$d/$1.pem" 2>/dev/null \
              || openssl x509 -inform DER -in "$d/$1.raw" -out "$d/$1.pem"
          }
          get root https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          get sub  https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          openssl x509 -in "$d/root.pem" -noout -subject -issuer -dates
          openssl x509 -in "$d/root.pem" -noout -subject | grep -q "Russian Trusted Root CA"
          openssl verify -CAfile "$d/root.pem" "$d/root.pem" "$d/sub.pem"   # root самоподписан, sub выпущен root
          for f in root sub; do
            fp=$(openssl x509 -in "$d/$f.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)
            echo "::notice title=Сертификат Минцифры ($f)::SHA-256 $fp"
            want=$([ "$f" = root ] && echo "$RU_ROOT_SHA256" || echo "$RU_SUB_SHA256")
            if [ -n "$want" ] && [ "$want" != "$fp" ]; then
              echo "::error::Отпечаток сертификата $f не совпадает с закреплённым"; exit 1
            fi
          done
          cat "$(python -c 'import certifi; print(certifi.where())')" "$d/root.pem" "$d/sub.pem" > "$d/bundle.pem"
          echo "TINVEST_CA_BUNDLE=$d/bundle.pem" >> "$GITHUB_ENV"

      - name: Сбор
        # ЦБ собирается первым, status.json пишется после каждого источника; T-Invest ограничен
        # бюджетом времени сборщика (12 мин), шаг — 25 мин, чтобы успеть сохранить собранное
        timeout-minutes: 25
        # токен T-Invest API (только чтение) — секрет репозитория; без него источники T-Invest пропускаются
        env:
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
        run: python -m scripts.collect_data

      - name: Сохранить изменения
        if: always()          # уже записанные файлы (ЦБ, status.json) коммитим и при сбое/таймауте сбора
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f public/data/*.tmp public/data/.*.tmp
          git add public/data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Данные ЦБ и T-Invest на $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
